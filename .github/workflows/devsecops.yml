name: "Pipeline DevSecOps"

on:
  push:
    branches:
      - "feature/pipeline"

  pull_request:
    branches:
      - "main"

  workflow_dispatch:

jobs:
  sast:
    name: "Análisis SAST con CodeQL"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: "Clonación de  repositorio"
        uses: actions/checkout@v6

      - name: "Inicializar CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: "Ejecutar análisis SAST"
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
          wait-for-processing: true

      - name: "Aplicar Quality Gate SAST"
        uses: advanced-security/policy-as-code@v2.11.1
        with:
          severity: medium
          action: break
          ref: ${{ github.ref }}

  sca:
    name: "Análisis SCA"
    needs:
      - sast
    runs-on: ubuntu-latest

    steps:
      - name: "Mensaje temporal SCA"
        run: echo "SAST aprobado. Comienza el análisis SCA."