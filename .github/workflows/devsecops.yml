name: "Pipeline DevSecOps"

on:
  push:
    branches:
      - "feature/pipeline"

  pull_request:
    branches:
      - "main"

  workflow_dispatch:

jobs:
  sast:
    name: "Análisis SAST con CodeQL"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: "Clonación de repositorio"
        uses: actions/checkout@v6

      - name: "Inicializar CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: "Ejecutar análisis SAST"
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
          wait-for-processing: true

      - name: "Aplicar Quality Gate SAST"
        uses: advanced-security/policy-as-code@v2.11.1
        with:
          severity: medium
          action: break
          ref: ${{ github.ref }}

  sca:
    name: "Análisis SCA con OWASP Dependency-Check"
    needs:
      - sast
    runs-on: ubuntu-latest

    steps:
      name: "SCA - OWASP Dependency-Check"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: "Clonar repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Java para Dependency-Check"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: "Verificar Maven"
        run: mvn --version

      - name: "Ejecutar análisis SCA"
        run: |
          mvn --batch-mode \
            org.owasp:dependency-check-maven:12.2.2:check \
            -DfailBuildOnCVSS=4 \
            -Dformat=HTML,JSON \
            -Dodc.outputDirectory=target/dependency-check \
            -DfailOnError=true \
            -DossindexAnalyzerEnabled=false

      - name: "Guardar reporte SCA"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "dependency-check-report"
          path: "target/dependency-check/"
          if-no-files-found: warn
