name: "Pipeline DevSecOps"

on:
  push:
    branches:
      - "feature/pipeline"

  pull_request:
    branches:
      - "main"

  workflow_dispatch:

jobs:
  sast:
    name: "Análisis SAST con CodeQL"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: "Clonación de repositorio"
        uses: actions/checkout@v6

      - name: "Inicializar CodeQL"
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: "Ejecutar análisis SAST"
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
          wait-for-processing: true

      - name: "Aplicar Quality Gate SAST"
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Consultando alertas CodeQL para la rama ${{ github.ref_name }}..."

        ALERTS=$(gh api \
          --paginate \
          -H "Accept: application/vnd.github+json" \
          "/repos/${{ github.repository }}/code-scanning/alerts?state=open&ref=${{ github.ref }}" \
          --jq '[.[] 
            | select(.tool.name == "CodeQL")
            | select(
                .rule.security_severity_level == "medium" or
                .rule.security_severity_level == "high" or
                .rule.security_severity_level == "critical"
              )
          ]')

        COUNT=$(echo "$ALERTS" | jq 'length')

        echo "Alertas MEDIUM/HIGH/CRITICAL: $COUNT"
        echo ""

        if [ "$COUNT" -gt 0 ]; then
          echo "$ALERTS" | jq -r '
            .[] |
            "[\(.rule.security_severity_level | ascii_upcase)]
             Archivo: \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"
          '

          echo ""
          echo "Quality Gate SAST: FAILED"
          echo "Se detectaron $COUNT vulnerabilidades con severidad MEDIUM o superior."
          exit 1
        fi

        echo "Quality Gate SAST: PASSED"
        echo "No se encontraron vulnerabilidades MEDIUM, HIGH o CRITICAL." 

  sca:
    name: "Análisis SCA con OWASP Dependency-Check"
    needs:
      - sast
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: "Clonar repositorio"
        uses: actions/checkout@v6

      - name: "Configurar Java para Dependency-Check"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: "Verificar Maven"
        run: mvn --version

      - name: "Ejecutar análisis SCA"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn --batch-mode \
            org.owasp:dependency-check-maven:12.2.2:check \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -DnvdMaxRetryCount=10 \
            -DfailBuildOnCVSS=4 \
            -Dformats=HTML,JSON \
            -Dodc.outputDirectory=target/dependency-check \
            -DfailOnError=true \
            -DossindexAnalyzerEnabled=false

  image_security:
    name: "Build Docker e Image Security con Trivy"
    needs:
      - sast
      - sca
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: "Clonar repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Java"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: "Compilar aplicación"
        run: |
          mvn --batch-mode clean package -DskipTests
          ls -lah target/*.jar

      - name: "Construir imagen Docker"
        run: |
          docker build \
            --tag pet-clinic:${{ github.sha }} \
            .

      - name: "Verificar imagen construida"
        run: |
          docker image inspect pet-clinic:${{ github.sha }}
          docker image ls pet-clinic

      - name: "Analizar imagen con Trivy"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "pet-clinic:${{ github.sha }}"
          scanners: "vuln"
          vuln-type: "os,library"
          format: "table"
          output: "trivy-report.txt"
          severity: "MEDIUM,HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: false

      - name: "Mostrar reporte de Trivy"
        if: always()
        run: |
          if [ -f trivy-report.txt ]; then
            cat trivy-report.txt
          else
            echo "No se generó el reporte de Trivy."
          fi

      - name: "Guardar reporte de Trivy"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "trivy-image-security-report"
          path: "trivy-report.txt"
          if-no-files-found: warn          